# 源池 / cron 静默失败探针（audit-41 S5-1）。
#
# 为什么存在：三条 Vercel cron（shuyuan / reclaim / drain）失败时，Vercel 默认不发任何告警。
# 2026-09-21 源池停摆 10 小时，是靠人肉盯 refreshed_at 才发现的。这里用一个**无凭据**的
# 定时探针读匿名只读健康端点 /api/health/sources，超阈值就开一条带固定 label 的 issue
# 留痕；恢复后自动关单。没有这条通道，「表面全绿但治理线停了」只能靠人偶然看见。
#
# ⚠️ 凭据纪律（与 ci.yml 同一标准）：本工作流**不读任何 Secret**。
#   - 端点是无鉴权的只读聚合端点（payload 只有数字/时间戳，无源站/用户/凭据）。
#   - 地址取仓库 **Variable** `HEALTH_URL`（Variable 不是 Secret，明文可见）。仓库里没有
#     已公开的生产域名，所以这里**不留域名兜底常量**——未设置时直接失败并提示，绝不猜一个。
#   - 开/关 issue 用的是 Actions 自带的短期 token（下方 `${{ github.token }}`，等价于
#     `GITHUB_TOKEN`），由平台自动注入、随 job 结束失效，无需用户配置、不是仓库 Secret。
#
# 阈值必须与 src/lib/source-health.ts 里的常数一致（改 cron 计划时两处一起改）。
# Vercel Hobby 限「每条 cron 每天最多触发一次」，三条 cron 的间隔均为 24h，阈值 = 24h + 2h 容差：
#   SHUYUAN_REFRESH_ALERT_HOURS = 26 —— shuyuan 每日一次 + 2h 容差
#   CRON_ALERT_HOURS           = 26 —— reclaim / drain 每日一次 + 2h 容差
# 离线门禁 src/lib/vercel-cron.test.ts 会按 vercel.json 真算间隔比对这两组常数，脱节即红（防漏改）。
name: Source health probe

on:
  schedule:
    # 健康端点不必按 cron 的计划点对齐；错开整点避开平台高峰。
    # xfer41：每小时 → 每 3 小时。每次探测都会在冷实例上合成一遍源池（读库），Neon 免费档传输额度
    # 09-25 被打爆；告警阈值是 26h，晚最多 3h 发现对「每日 cron 停摆」这类故障可接受。
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-health-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # HEALTH_URL 未配置时按触发源区别对待（github.event_name 由平台注入，'schedule' / 'workflow_dispatch'）：
    #   - schedule：整 job 跳过。跳过记绿而非失败，消掉「每小时一次 workflow run failed」的通知噪声。
    #   - workflow_dispatch：仍要跑，让第一步明确 exit 1 并提示去配 Variable。手动触发却静默跳过，
    #     会让人以为探针跑过且健康 —— 这正是要保住的性质。
    if: github.event_name == 'workflow_dispatch' || vars.HEALTH_URL != ''
    env:
      HEALTH_BASE: ${{ vars.HEALTH_URL }}
      ISSUE_LABEL: source-health
      SHUYUAN_REFRESH_ALERT_HOURS: '26'
      CRON_ALERT_HOURS: '26'
    steps:
      - name: 评估健康状态
        id: assess
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_BASE}" ]; then
            echo "::error::仓库 Variable HEALTH_URL 未设置，探针无地址可查（本工作流刻意不留域名兜底常量）。请在 Settings → Secrets and variables → Actions → Variables 添加 HEALTH_URL，值为生产根地址。"
            exit 1
          fi
          url="${HEALTH_BASE%/}/api/health/sources"
          code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$url" || true)
          [ -n "$code" ] || code=000

          reason=""
          if [ "$code" != "200" ]; then
            reason="健康端点不可达（HTTP ${code}）"
          elif ! jq -e . health.json >/dev/null 2>&1; then
            reason="健康端点返回的不是合法 JSON（HTTP 200）"
          else
            now=$(date -u +%s)
            # 单条判据：ISO 时间戳空/不可解析/超阈值都算异常，累加进 reason。
            check_iso() { # $1=标签 $2=ISO 或 null $3=阈值小时
              local label="$1" iso="$2" max="$3" t age
              if [ -z "$iso" ] || [ "$iso" = "null" ]; then
                reason="${reason}${label} 从未记录到成功; "; return
              fi
              t=$(date -u -d "$iso" +%s 2>/dev/null || true)
              if [ -z "$t" ]; then
                reason="${reason}${label} 时间戳无法解析; "; return
              fi
              age=$(( (now - t) / 3600 ))
              if [ "$age" -gt "$max" ]; then
                reason="${reason}${label} 已 ${age}h 未成功（阈值 ${max}h）; "
              fi
            }
            refreshed=$(jq -r '.refreshedAtAgeHours' health.json)
            if [ "$refreshed" = "null" ] || [ -z "$refreshed" ]; then
              reason="${reason}源池从未刷新; "
            elif awk -v a="$refreshed" -v m="$SHUYUAN_REFRESH_ALERT_HOURS" 'BEGIN{exit !(a > m)}'; then
              reason="${reason}源池已 ${refreshed}h 未刷新（阈值 ${SHUYUAN_REFRESH_ALERT_HOURS}h）; "
            fi
            check_iso "shuyuan" "$(jq -r '.crons.shuyuan.lastSuccessAt' health.json)" "$SHUYUAN_REFRESH_ALERT_HOURS"
            check_iso "reclaim" "$(jq -r '.crons.reclaim.lastSuccessAt' health.json)" "$CRON_ALERT_HOURS"
            check_iso "drain" "$(jq -r '.crons.drain.lastSuccessAt' health.json)" "$CRON_ALERT_HOURS"
            if [ "$(jq -r '.ok' health.json)" != "true" ] && [ -z "$reason" ]; then
              reason="端点自报 ok=false，但未匹配到具体原因（阈值口径可能与 src/lib/source-health.ts 漂移）"
            fi
          fi

          reason="${reason%; }"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then echo "判定：异常 —— ${reason}"; else echo "判定：健康"; fi

      - name: 开 / 更 / 关 告警 issue
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 刻意不 checkout(探针只需 curl,GitHub 的 run 工作目录不是 git 仓库)。
          # gh 命令依赖仓库上下文,不显式给 GH_REPO 会报 `fatal: not a git repository` 而失败
          # ——2026-09-23 首次配好 HEALTH_URL 触发时才暴露(此前该 job 因 HEALTH_URL 未设整段跳过)。
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.assess.outputs.reason }}
        run: |
          set -euo pipefail
          # 固定 label 是去重键；create --force 幂等（已存在则更新），失败不阻断主流程。
          gh label create "$ISSUE_LABEL" --description "源池/cron 健康探针自动开单" --color BFD4F2 --force >/dev/null 2>&1 || true
          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "${REASON}" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "[source-health] 源池 / cron 健康异常" --label "$ISSUE_LABEL" --body "$REASON"
            else
              # 去重：只有原因与上一条评论不同才追加，避免每小时刷屏。
              last=$(gh issue view "$number" --json comments --jq '(.comments | last | .body) // ""')
              if [ "$last" != "$REASON" ]; then
                gh issue comment "$number" --body "$REASON"
              else
                echo "原因未变，跳过评论（去重）"
              fi
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "已恢复：健康端点 ok=true，池新鲜度与三条 cron 均在阈值内。"
            gh issue close "$number"
          else
            echo "健康，且无未关闭的告警 issue"
          fi
