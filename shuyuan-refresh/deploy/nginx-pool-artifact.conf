# 41-poolimpl：源池产物静态分发。放进既有 vhost /etc/nginx/sites-available/zhaoshu-tempdb.conf 的 443 server 块内
# （与 /sql、/v2 并列）。只读 GET/HEAD；ETag 由 nginx 静态文件自带（Vercel 侧带 If-None-Match，未变 304）；
# gzip 压缩 JSON（≈230 KB → 数十 KB）。内容是公开书源规则、准入结论与 host 名，不含凭据，不设鉴权（见 poolimpl-41-report §4）。
location = /pool-artifact.json {
    alias /var/www/zhaoshu-pool/pool-artifact.json;
    default_type application/json;
    etag on;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-cache" always;
    limit_except GET { deny all; }
}
