# 书径（zhaoshu / book）站点 —— phoenix 生产站点配置的**占位符版**。
#
# 取回自 phoenix `/etc/nginx/sites-enabled/zhaoshu-stage.conf` 中 server_name 为
# `book.cloud.us.kg` 的两个 server 块（2026-10-18，crons5）。域名与 IP 已换成占位符
# <book-domain> / <book-ip>；证书路径保留 `/etc/letsencrypt/live/<book-domain>/`
# 结构，落地时整串替换即可。stage 块（原 server_name stage.cloud.us.kg）未收录——
# 它是冷备/演练站，不是生产站。
#
# 部署：拷到 /etc/nginx/sites-enabled/book.conf（或并入既有站点文件）后
#   nginx -t && systemctl reload nginx
#
# 反向目标固定为回环 127.0.0.1:3000 —— 与 zhaoshu-web.service 的
# Environment=HOSTNAME=127.0.0.1 / PORT=3000 成对；不要改成对外地址。

server {
    listen 80;
    server_name <book-domain>;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name <book-domain>;

    ssl_certificate /etc/letsencrypt/live/<book-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<book-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZSProd:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
